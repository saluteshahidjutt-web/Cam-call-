<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c896" />
      <stop offset="100%" stop-color="#008f6b" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Internal Glow/Border -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" />

  <!-- Video Camera Icon Body -->
  <g filter="url(#dropShadow)" transform="translate(106, 136)">
    <!-- Camera Body -->
    <rect x="0" y="0" width="200" height="150" rx="36" fill="#ffffff"/>
    
    <!-- Camera Lens / Triangular Projector -->
    <path d="M 215 35 L 290 0 L 290 150 L 215 115 Z" fill="#ffffff" stroke-linejoin="round"/>
    
    <!-- Camera Lens Ring -->
    <circle cx="100" cy="75" r="38" fill="#00a884" opacity="0.9"/>
    <circle cx="100" cy="75" r="22" fill="#ffffff"/>
    <circle cx="108" cy="67" r="7" fill="#00a884"/>
    
    <!-- Call/Signal Waves Indicator -->
    <circle cx="270" cy="-20" r="14" fill="#25d366" stroke="#ffffff" stroke-width="3"/>
  </g>
</svg>
